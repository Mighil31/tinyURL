name: tinyurl
region: blr
services:
  - name: web
    github:
      repo: Mighil31/tinyURL
      branch: main
      deploy_on_push: true
    dockerfile_path: Dockerfile
    instance_size_slug: apps-s-1vcpu-0.5gb
    instance_count: 1
    http_port: 8080
    health_check:
      http_path: /healthz
    routes:
      - path: /
    envs:
      - key: BASE_URL
        value: ${APP_URL}
      - key: DB_HOST
        value: ${tinyurl-db.HOSTNAME}
      - key: DB_PORT
        value: ${tinyurl-db.PORT}
      - key: DB_NAME
        value: ${tinyurl-db.DATABASE}
      - key: DB_USER
        value: ${tinyurl-db.USERNAME}
      - key: DB_PASSWORD
        value: ${tinyurl-db.PASSWORD}
        type: SECRET
      - key: DB_SSLMODE
        value: require
      # key:tier,... encrypted by App Platform; plaintext is never committed
      - key: API_KEYS
        type: SECRET
        scope: RUN_TIME
        value: EV[1:7L0h6XjNtuieVimuFun9+HAA24yWa4HX:yzmz758XfZKpkJzQUxvqdqz34G5x6jOT6eXkmy+9c/M8sx7RIWEZN8tOnazS8yFnQEPAEsXLXhl4eW/4E16q1nMcOiF5DkGScDT+kZJh/tkM6s2lcVKfLNQKdH3bx59V3DB86of5Jj/IrJSwsiD77iPdD8sMzvR3faqxVo0eIFk=]
databases:
  - name: tinyurl-db
    engine: PG
    production: true
    cluster_name: tinyurl-db
