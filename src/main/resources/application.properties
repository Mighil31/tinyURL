spring.application.name=tinyurl
server.port=${PORT:8080}

app.base-url=${BASE_URL:http://localhost:8080}
# key:tier,... (tiers: free, pro). Local defaults only; production sets API_KEYS as a SECRET.
app.api-keys=${API_KEYS:dev-free-key:free,dev-pro-key:pro}

spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:tinyurl}?sslmode=${DB_SSLMODE:disable}
spring.datasource.username=${DB_USER:tinyurl}
spring.datasource.password=${DB_PASSWORD:tinyurl}
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:5}
